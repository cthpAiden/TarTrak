name: release
on:
  push:
    tags: ["v*"]
  # Run workflow on main: tags it v<version from tauri.conf.json> and releases it, for when pushing a tag is not possible.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    # Every action is pinned to a commit: this job holds the update signing key, and a moved tag
    # could otherwise ship a signed build to every install.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # latest.json takes its version from tauri.conf.json, not the tag. A forgotten bump would publish a
      # release whose manifest still names the old version, which every installed app ignores.
      - name: Tag must match the app version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            # An existing tag means this version is out already: bump it rather than publish over it.
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
              echo "::error::v$v is already tagged; bump the version first"
              exit 1
            fi
            echo "TAG=v$v" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version v$v"
            exit 1
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # On a manual run the tag does not exist yet; the release creates it on the commit just built.
          tagName: ${{ env.TAG }}
          releaseName: "TarTrak ${{ env.TAG }}"
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
