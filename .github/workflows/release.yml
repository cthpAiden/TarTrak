name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # latest.json takes its version from tauri.conf.json, not the tag. A forgotten bump would publish a
      # release whose manifest still names the old version, which every installed app ignores.
      - name: Tag must match the app version
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version v$v"
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TarTrak ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
