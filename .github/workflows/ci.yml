name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: cmp src/lib/room/protocol.ts relay/src/protocol.ts
      - run: npm test
      - run: npm run check
      - run: npm run build
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: relay/package-lock.json }
      - run: npm ci
      - run: npm test
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
