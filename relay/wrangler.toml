name = "tartrak-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# SQLite-backed classes are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Room requests per client IP. Approximate and counted per Cloudflare location, which is enough to
# make guessing room codes slow. A squad joins once each and reconnects with a backoff, far below it.
[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = false
